[project]
name = "miaband"
version = "0.1.0"
description = "Local, offline health analytics for Xiaomi bands (Mi Fitness export / Gadgetbridge)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
miaband = "miaband.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["miaband*"]

[tool.setuptools.package-data]
"miaband.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
